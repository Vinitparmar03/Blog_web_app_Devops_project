services:
  blog-webapplication:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        
    env_file:
      - ../.env
      - ../.env.local
    
    environment:
      NODE_OPTIONS: "--network-family-autoselection-attempt-timeout=8000"

    ports:
      - "3000:3000"


    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health/live || exit 1"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

    restart: unless-stopped