apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-webapp-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

spec:
  ingressClassName: nginx
  rules:
    - host: blogwebapp.com
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: blog-webapp-service
              port:
                number: 80