grafana:
  enabled: true

  adminUser: admin
  adminPassword: admin

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.blogwebapp.com
    path: /
    pathType: Prefix

prometheus:
  enabled: true

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - prometheus.blogwebapp.com
    paths:
      - /
    pathType: Prefix

  prometheusSpec:
    serviceMonitorSelector:
      matchLabels:
        release: monitoring