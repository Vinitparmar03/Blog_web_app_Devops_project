apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blog-service-monitor
  namespace: monitoring
  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - default

  selector:
    matchLabels:
      app: blog-webapp

  endpoints:
    - interval: 30s
      port: http
      path: /api/metrics