apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-webapp-deployment
  labels:
    app: blog-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-webapp
  template:
    metadata:
      labels:
        app: blog-webapp
    spec:
      containers:
        - name: blog-webapp
          image: vinitparmar03/blog-webapplication:02
          ports:
            - containerPort: 3000
          
          envFrom:
            - secretRef:
                name: clerk-secret
            - secretRef:
                name: cloudinary-secret
            - secretRef:
                name: database-secret
          
          env:
            - name: NODE_OPTIONS
              value: "--network-family-autoselection-attempt-timeout=8000"
          
          resources:
            requests:
              cpu: "50m"
              memory: "100Mi"
            limits:
              cpu: "100m"
              memory: "101Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 30
            successThreshold: 1
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3